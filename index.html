<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d4c" />
  <meta name="description" content="나라별 여행 일정 · 비행 · 숙소 · 기차" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trip" />
  <meta name="application-name" content="Trip" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=3" />
  <title>Trip · 여행 일정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13252c;
      --ink-soft: #3d5560;
      --muted: #6b828c;
      --line: #d7e2e7;
      --bg: #eef4f6;
      --surface: #ffffff;
      --brand: #0f3d4c;
      --brand-2: #1a6b7a;
      --flight: #2f6fed;
      --hotel: #7a5af8;
      --train: #0f9d8a;
      --place: #c45c26;
      --food: #c23b5e;
      --note: #5b6b75;
      --danger: #c62828;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(19, 37, 44, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(26, 107, 122, 0.18), transparent 55%),
        radial-gradient(900px 400px at 100% 0%, rgba(196, 92, 38, 0.12), transparent 45%),
        linear-gradient(180deg, #e8f1f4 0%, var(--bg) 40%, #e7eef1 100%);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }
    a { color: inherit; }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding-bottom: calc(96px + var(--safe-bottom));
    }
    .install-tip {
      display: none;
      margin: 12px 16px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(15, 61, 76, 0.06);
      border: 1px solid rgba(15, 61, 76, 0.12);
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.45;
    }
    .install-tip.show { display: block; }
    .install-tip strong { color: var(--brand); }
    .install-tip .tip-actions { display: flex; gap: 8px; margin-top: 10px; }
    .install-tip button {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
    }
    .install-tip button.ghost {
      background: #fff;
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }
    .hero {
      padding: calc(24px + var(--safe-top)) 20px 18px;
      color: #f4fafb;
      background:
        linear-gradient(145deg, rgba(15, 61, 76, 0.96), rgba(26, 107, 122, 0.92)),
        url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='0.08'%3E%3Cpath d='M0 40h160M0 80h160M0 120h160M40 0v160M80 0v160M120 0v160'/%3E%3C/g%3E%3C/svg%3E");
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 18px 40px rgba(15, 61, 76, 0.22);
    }
    .app-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(244, 250, 251, 0.7);
      margin-bottom: 8px;
    }
    .brand {
      font-family: "Fraunces", serif;
      font-size: 34px;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .hero p {
      margin-top: 8px;
      color: rgba(244, 250, 251, 0.82);
      font-size: 14px;
      line-height: 1.45;
      max-width: 30ch;
    }
    .hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 500;
    }
    #syncChip[data-status="ok"] { background: rgba(31, 138, 91, 0.28); }
    #syncChip[data-status="pending"] { background: rgba(196, 148, 38, 0.3); }
    #syncChip[data-status="err"] { background: rgba(198, 40, 40, 0.28); }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 14px 16px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .tool-btn {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(19, 37, 44, 0.04);
    }
    .day-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 16px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      z-index: 5;
      background: linear-gradient(180deg, rgba(238, 244, 246, 0.96), rgba(238, 244, 246, 0.88));
      backdrop-filter: blur(10px);
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: 0 0 auto;
      min-width: 72px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      text-align: center;
    }
    .day-tab strong { display: block; font-size: 13px; font-weight: 700; }
    .day-tab span { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
    .day-tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 10px 20px rgba(15, 61, 76, 0.2);
    }
    .day-tab.active span { color: rgba(255, 255, 255, 0.75); }
    .content { padding: 8px 16px 20px; }
    .day-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin: 8px 2px 14px;
    }
    .day-title h2 {
      font-family: "Fraunces", serif;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .day-title span { font-size: 12px; color: var(--muted); font-weight: 500; }
    .item-wrap { position: relative; padding-left: 28px; }
    .item-wrap::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 28px;
      bottom: -8px;
      width: 2px;
      background: var(--line);
    }
    .item-wrap:last-child::before { display: none; }
    .dot {
      position: absolute;
      left: 0;
      top: 18px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--brand-2);
      box-shadow: 0 0 0 4px rgba(26, 107, 122, 0.12);
      z-index: 1;
    }
    .dot.flight { border-color: var(--flight); box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12); }
    .dot.hotel { border-color: var(--hotel); box-shadow: 0 0 0 4px rgba(122, 90, 248, 0.12); }
    .dot.train { border-color: var(--train); box-shadow: 0 0 0 4px rgba(15, 157, 138, 0.12); }
    .dot.place { border-color: var(--place); box-shadow: 0 0 0 4px rgba(196, 92, 38, 0.12); }
    .dot.food { border-color: var(--food); box-shadow: 0 0 0 4px rgba(194, 59, 94, 0.12); }
    .dot.note { border-color: var(--note); box-shadow: 0 0 0 4px rgba(91, 107, 117, 0.12); }
    .card {
      background: var(--surface);
      border: 1px solid rgba(215, 226, 231, 0.9);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }
    .card.open {
      box-shadow: 0 16px 36px rgba(19, 37, 44, 0.12);
      border-color: rgba(26, 107, 122, 0.28);
    }
    .card-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
    }
    .type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef3f5;
      color: var(--ink-soft);
    }
    .badge.flight { background: #e8f0ff; color: var(--flight); }
    .badge.hotel { background: #efeaff; color: var(--hotel); }
    .badge.train { background: #e6f7f4; color: var(--train); }
    .badge.place { background: #fceee6; color: var(--place); }
    .badge.food { background: #fce8ee; color: var(--food); }
    .badge.note { background: #eef1f3; color: var(--note); }
    .time { font-size: 12px; color: var(--muted); font-weight: 600; }
    .title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
    .subtitle { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.35; }
    .chev {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: #f2f6f8; color: var(--muted);
      transition: transform 0.2s ease; margin-top: 2px;
    }
    .card.open .chev { transform: rotate(180deg); background: #e5f2f4; color: var(--brand-2); }
    .details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .card.open .details { display: block; }
    .details p { font-size: 13px; color: var(--ink-soft); line-height: 1.5; white-space: pre-wrap; }
    .meta-grid { display: grid; gap: 8px; margin-top: 10px; }
    .meta {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 12px; padding: 8px 10px; border-radius: 10px; background: #f5f9fa;
    }
    .meta span:first-child { color: var(--muted); }
    .meta strong { font-weight: 600; text-align: right; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 38px; padding: 0 12px; border-radius: 12px;
      font-size: 13px; font-weight: 600; border: 1px solid transparent;
    }
    .btn-primary { background: var(--brand); color: #fff; flex: 1 1 auto; }
    .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink-soft); }
    .btn-danger { background: #fff5f5; color: var(--danger); border-color: #f3d0d0; }
    .travel {
      display: flex; align-items: center; gap: 8px;
      margin: -2px 0 10px 28px; padding: 0 4px;
      color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .travel a {
      color: var(--brand-2); text-decoration: none;
      border-bottom: 1px dashed rgba(26, 107, 122, 0.45);
    }
    .travel-line {
      flex: 1; height: 1px;
      background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);
    }
    .empty {
      text-align: center; padding: 48px 20px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed var(--line); border-radius: 20px;
    }
    .empty h3 { font-family: "Fraunces", serif; font-size: 20px; margin-bottom: 8px; }
    .empty p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .fab-bar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + var(--safe-bottom));
      width: min(448px, calc(100% - 24px));
      display: flex; gap: 8px; z-index: 20;
    }
    .fab {
      flex: 1; min-height: 52px; border-radius: 16px;
      background: var(--brand); color: #fff;
      font-weight: 700; font-size: 15px;
      box-shadow: 0 14px 30px rgba(15, 61, 76, 0.28);
    }
    .fab.secondary {
      flex: 0 0 52px; background: #fff; color: var(--brand);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(19, 37, 44, 0.12);
      font-size: 22px;
    }
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(12, 24, 28, 0.45);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%);
      width: min(480px, 100%); max-height: min(92vh, 820px); overflow: auto;
      background: #fff; border-radius: 24px 24px 0 0;
      padding: 14px 16px calc(20px + var(--safe-bottom));
      z-index: 50;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.18);
    }
    .sheet.show { transform: translate(-50%, 0); }
    .sheet-handle {
      width: 42px; height: 4px; border-radius: 999px;
      background: #d7e0e4; margin: 0 auto 12px;
    }
    .sheet h3 { font-family: "Fraunces", serif; font-size: 22px; margin-bottom: 14px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; background: #f8fbfc; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #8eb8c2; background: #fff;
      box-shadow: 0 0 0 3px rgba(26, 107, 122, 0.12);
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--ink); color: #fff; padding: 10px 14px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: 0.25s ease; z-index: 60;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .menu { display: grid; gap: 8px; }
    .menu button {
      text-align: left; padding: 14px; border-radius: 14px;
      background: #f5f9fa; font-weight: 600; font-size: 14px;
    }
    .menu button small {
      display: block; margin-top: 3px; color: var(--muted);
      font-weight: 500; font-size: 12px;
    }
    .menu button.active-trip {
      background: #e5f2f4; border: 1px solid rgba(26, 107, 122, 0.25);
    }
    @media (min-width: 520px) {
      body { padding: 18px 0; }
      .app {
        border-radius: 28px; overflow: clip;
        box-shadow: 0 24px 60px rgba(19, 37, 44, 0.12);
        background: rgba(255, 255, 255, 0.35);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="app-label">Trip</div>
      <div class="brand" id="tripBrand">새 여행</div>
      <p id="tripSubtitle">나라별로 여행을 만들고 일정을 쌓아보세요.</p>
      <div class="hero-meta">
        <span class="chip" id="syncChip" data-status="pending">동기화 준비</span>
        <span class="chip" id="dateRangeChip">날짜 미설정</span>
        <span class="chip" id="countChip">일정 0</span>
      </div>
    </header>

    <div class="install-tip" id="installTip">
      <strong>홈 화면에 추가하기</strong><br />
      Safari 하단 <b>공유</b> → <b>홈 화면에 추가</b> → 이름은 <b>Trip</b>으로 저장하세요.
      <div class="tip-actions">
        <button type="button" class="ghost" id="dismissTipBtn">닫기</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-btn" type="button" id="tripsBtn">여행 목록</button>
      <button class="tool-btn" type="button" id="editTripBtn">여행 정보</button>
      <button class="tool-btn" type="button" id="addDayBtn">날짜 추가</button>
      <button class="tool-btn" type="button" id="exportBtn">내보내기</button>
      <button class="tool-btn" type="button" id="importBtn">불러오기</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
    </div>

    <div class="day-tabs" id="dayTabs"></div>
    <main class="content">
      <div class="day-title">
        <h2 id="dayHeading">Day 1</h2>
        <span id="dayCount">0개 일정</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </main>
  </div>

  <div class="fab-bar">
    <button class="fab secondary" type="button" id="menuFab" aria-label="더보기">⋯</button>
    <button class="fab" type="button" id="addItemFab">+ 일정 추가</button>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>

  <div class="sheet" id="itemSheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h3 id="itemSheetTitle">일정 추가</h3>
    <form class="form" id="itemForm">
      <div class="field">
        <label for="itemType">유형</label>
        <select id="itemType">
          <option value="place">관광 / 장소</option>
          <option value="flight">비행기</option>
          <option value="hotel">숙박</option>
          <option value="train">기차</option>
          <option value="food">식사</option>
          <option value="note">메모</option>
        </select>
      </div>
      <div class="field">
        <label for="itemTitle">제목</label>
        <input id="itemTitle" required placeholder="예: 콜로세움" />
      </div>
      <div class="field">
        <label for="itemPlace">장소 / 주소</label>
        <input id="itemPlace" placeholder="예: 도시, 명소 주소" />
      </div>
      <div class="row-2">
        <div class="field">
          <label for="itemStart">시작</label>
          <input id="itemStart" type="time" />
        </div>
        <div class="field">
          <label for="itemEnd">종료</label>
          <input id="itemEnd" type="time" />
        </div>
      </div>
      <div class="field">
        <label for="itemTravel">다음 장소까지 이동시간</label>
        <input id="itemTravel" placeholder="예: 도보 15분 / 지하철 20분" />
      </div>
      <div class="field">
        <label for="itemMaps">구글맵 검색어 또는 URL</label>
        <input id="itemMaps" placeholder="장소명 또는 maps.google.com 링크" />
      </div>
      <div class="field">
        <label for="itemNote">메모</label>
        <textarea id="itemNote" placeholder="예약번호, 입장권, 팁 등"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" id="cancelItemBtn">취소</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </div>

  <div class="sheet" id="tripSheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h3>여행 정보</h3>
    <form class="form" id="tripForm">
      <div class="field">
        <label for="tripTitle">나라 / 여행 이름</label>
        <input id="tripTitle" placeholder="예: 이탈리아, 일본, 스페인" />
      </div>
      <div class="field">
        <label for="tripDesc">한 줄 소개</label>
        <input id="tripDesc" placeholder="예: 로마 · 피렌체 · 베네치아" />
      </div>
      <div class="row-2">
        <div class="field">
          <label for="tripStart">시작일</label>
          <input id="tripStart" type="date" />
        </div>
        <div class="field">
          <label for="tripEnd">종료일</label>
          <input id="tripEnd" type="date" />
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" type="button" id="cancelTripBtn">취소</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </div>

  <div class="sheet" id="tripsSheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h3>여행 목록</h3>
    <div class="menu" id="tripsList"></div>
    <div class="actions" style="margin-top:14px">
      <button class="btn btn-primary" type="button" id="addTripBtn">+ 새 나라 여행</button>
    </div>
  </div>

  <div class="sheet" id="menuSheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h3>더보기</h3>
    <div class="menu">
      <button type="button" id="menuAddDay">
        날짜 추가
        <small>현재 여행을 Day로 나눠 관리</small>
      </button>
      <button type="button" id="menuDeleteDay">
        현재 날짜 삭제
        <small>선택한 Day와 그 안의 일정이 삭제됩니다</small>
      </button>
      <button type="button" id="menuClearTrip">
        현재 여행 일정 비우기
        <small>이 나라 여행의 일정만 초기화</small>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "trip-app-v2";
    const LEGACY_KEY = "italia-trip-v1";
    const SYNC = {
      endpoint: "https://mantledb.sh/v2/trip-wnqls49-art/store",
      key: "dbea48b90b96571441424588668e970108ef267729c364dc30d497cdfcbaa09c",
    };
    const TYPE_LABEL = {
      flight: "비행기", hotel: "숙박", train: "기차",
      place: "장소", food: "식사", note: "메모",
    };

    function uid() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function blankTrip(title = "새 여행") {
      const dayId = uid();
      return {
        id: uid(),
        title,
        subtitle: "일정·비행·숙소·기차를 한곳에서.",
        startDate: "",
        endDate: "",
        activeDayId: dayId,
        days: [{ id: dayId, label: "Day 1", date: "", items: [] }],
      };
    }

    function defaultStore() {
      const trip = blankTrip("이탈리아");
      return { version: 2, updatedAt: Date.now(), activeTripId: trip.id, trips: [trip] };
    }

    function migrate(raw) {
      if (!raw) return defaultStore();
      if (raw.version === 2 && Array.isArray(raw.trips) && raw.trips.length) {
        if (!raw.activeTripId) raw.activeTripId = raw.trips[0].id;
        if (!raw.updatedAt) raw.updatedAt = Date.now();
        return raw;
      }
      if (raw.days) {
        const trip = {
          id: uid(),
          title: raw.title && raw.title !== "Italia" ? raw.title : "이탈리아",
          subtitle: raw.subtitle || "일정·비행·숙소·기차를 한곳에서.",
          startDate: raw.startDate || "",
          endDate: raw.endDate || "",
          activeDayId: raw.activeDayId || raw.days[0]?.id || null,
          days: raw.days,
        };
        return { version: 2, updatedAt: raw.updatedAt || Date.now(), activeTripId: trip.id, trips: [trip] };
      }
      return defaultStore();
    }

    function loadLocal() {
      try {
        const v2 = localStorage.getItem(STORAGE_KEY);
        if (v2) return migrate(JSON.parse(v2));
        const v1 = localStorage.getItem(LEGACY_KEY);
        if (v1) {
          const migrated = migrate(JSON.parse(v1));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch {}
      return defaultStore();
    }

    let store = loadLocal();
    let openItemId = null;
    let editingItemId = null;
    let pendingRemote = null;
    let pushTimer = null;
    let applyingRemote = false;

    const els = {
      dayTabs: document.getElementById("dayTabs"),
      timeline: document.getElementById("timeline"),
      dayHeading: document.getElementById("dayHeading"),
      dayCount: document.getElementById("dayCount"),
      tripBrand: document.getElementById("tripBrand"),
      tripSubtitle: document.getElementById("tripSubtitle"),
      dateRangeChip: document.getElementById("dateRangeChip"),
      countChip: document.getElementById("countChip"),
      syncChip: document.getElementById("syncChip"),
      backdrop: document.getElementById("backdrop"),
      itemSheet: document.getElementById("itemSheet"),
      tripSheet: document.getElementById("tripSheet"),
      tripsSheet: document.getElementById("tripsSheet"),
      menuSheet: document.getElementById("menuSheet"),
      tripsList: document.getElementById("tripsList"),
      itemForm: document.getElementById("itemForm"),
      tripForm: document.getElementById("tripForm"),
      toast: document.getElementById("toast"),
      importFile: document.getElementById("importFile"),
    };

    function setSyncStatus(text, status) {
      if (!els.syncChip) return;
      els.syncChip.textContent = text;
      els.syncChip.dataset.status = status;
    }

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function save() {
      if (applyingRemote) {
        persistLocal();
        return;
      }
      store.updatedAt = Date.now();
      persistLocal();
      schedulePush();
    }

    function schedulePush() {
      clearTimeout(pushTimer);
      setSyncStatus("동기화 중…", "pending");
      pushTimer = setTimeout(() => {
        pushRemote().catch(() => setSyncStatus("오프라인 저장", "err"));
      }, 450);
    }

    async function pushRemote() {
      const res = await fetch(SYNC.endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Mantle-Key": SYNC.key,
        },
        body: JSON.stringify(store),
      });
      if (!res.ok) throw new Error("push failed");
      setSyncStatus("공유 중", "ok");
    }

    function sheetIsOpen() {
      return Boolean(document.querySelector(".sheet.show"));
    }

    function applyRemote(next, { silent } = {}) {
      if (sheetIsOpen()) {
        pendingRemote = next;
        setSyncStatus("새 변경 있음", "pending");
        return;
      }
      applyingRemote = true;
      store = next;
      persistLocal();
      openItemId = null;
      render();
      applyingRemote = false;
      setSyncStatus("공유 중", "ok");
      if (!silent) toast("다른 기기 변경이 반영됐어요");
    }

    function flushPendingRemote() {
      if (!pendingRemote) return;
      const next = pendingRemote;
      pendingRemote = null;
      applyRemote(next);
    }

    async function pullRemote({ silent } = {}) {
      try {
        const res = await fetch(SYNC.endpoint, { cache: "no-store" });
        if (!res.ok) throw new Error("pull failed");
        const remoteRaw = await res.json();
        const remoteEmpty = !remoteRaw?.trips?.length;
        if (remoteEmpty) {
          if (!store.updatedAt) store.updatedAt = Date.now();
          await pushRemote();
          return;
        }
        const remote = migrate(remoteRaw);
        const remoteAt = Number(remote.updatedAt || 0);
        const localAt = Number(store.updatedAt || 0);
        if (remoteAt > localAt) {
          applyRemote(remote, { silent });
        } else if (localAt > remoteAt) {
          await pushRemote();
        } else {
          setSyncStatus("공유 중", "ok");
        }
      } catch {
        setSyncStatus("오프라인 저장", "err");
      }
    }

    function activeTrip() {
      return store.trips.find((t) => t.id === store.activeTripId) || store.trips[0];
    }

    function activeDay() {
      const trip = activeTrip();
      return trip.days.find((d) => d.id === trip.activeDayId) || trip.days[0];
    }

    function totalItems(trip = activeTrip()) {
      return trip.days.reduce((n, d) => n + d.items.length, 0);
    }

    function formatDateLabel(dateStr) {
      if (!dateStr) return "날짜 미정";
      const d = new Date(dateStr + "T00:00:00");
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString("ko-KR", { month: "short", day: "numeric", weekday: "short" });
    }

    function mapsUrl(item) {
      const q = item.mapsQuery || item.place || item.title;
      if (!q) return null;
      if (/^https?:\/\//i.test(q)) return q;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }

    function directionsUrl(fromItem, toItem) {
      const origin = fromItem.mapsQuery || fromItem.place || fromItem.title;
      const dest = toItem.mapsQuery || toItem.place || toItem.title;
      if (!origin || !dest) return null;
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}&travelmode=transit`;
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function closeSheets() {
      [els.itemSheet, els.tripSheet, els.tripsSheet, els.menuSheet].forEach((s) => s.classList.remove("show"));
      els.backdrop.classList.remove("show");
      flushPendingRemote();
    }

    function openSheet(sheet) {
      closeSheets();
      els.backdrop.classList.add("show");
      sheet.classList.add("show");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderTripsList() {
      els.tripsList.innerHTML = store.trips
        .map((trip) => {
          const active = trip.id === store.activeTripId ? "active-trip" : "";
          return `
            <button type="button" class="${active}" data-switch="${trip.id}">
              ${escapeHtml(trip.title || "새 여행")}
              <small>${formatDateLabel(trip.startDate)} · 일정 ${totalItems(trip)}개</small>
            </button>
            ${
              store.trips.length > 1
                ? `<button type="button" data-delete-trip="${trip.id}" style="color:var(--danger)">
                    ${escapeHtml(trip.title || "여행")} 삭제
                    <small>이 나라 여행과 일정이 모두 삭제됩니다</small>
                  </button>`
                : ""
            }
          `;
        })
        .join("");
    }

    function render() {
      const trip = activeTrip();
      if (!trip) return;
      if (!trip.activeDayId || !trip.days.some((d) => d.id === trip.activeDayId)) {
        trip.activeDayId = trip.days[0]?.id || null;
      }

      document.title = `${trip.title || "Trip"} · Trip`;
      els.tripBrand.textContent = trip.title || "새 여행";
      els.tripSubtitle.textContent = trip.subtitle || "";

      if (trip.startDate || trip.endDate) {
        els.dateRangeChip.textContent = `${formatDateLabel(trip.startDate)} – ${formatDateLabel(trip.endDate)}`;
      } else {
        els.dateRangeChip.textContent = "날짜 미설정";
      }
      els.countChip.textContent = `일정 ${totalItems(trip)}`;

      els.dayTabs.innerHTML = trip.days
        .map((day, idx) => {
          const active = day.id === trip.activeDayId ? "active" : "";
          return `
            <button class="day-tab ${active}" type="button" data-day="${day.id}">
              <strong>${day.label || `Day ${idx + 1}`}</strong>
              <span>${formatDateLabel(day.date)}</span>
            </button>
          `;
        })
        .join("");

      const day = activeDay();
      if (!day) {
        els.timeline.innerHTML = `<div class="empty"><h3>날짜가 없어요</h3><p>먼저 날짜를 추가해 주세요.</p></div>`;
        return;
      }

      els.dayHeading.textContent = day.label || "Day";
      els.dayCount.textContent = `${day.items.length}개 일정`;

      if (!day.items.length) {
        els.timeline.innerHTML = `
          <div class="empty">
            <h3>아직 일정이 없어요</h3>
            <p>아래 <b>+ 일정 추가</b>로<br/>비행기, 숙소, 기차, 관광지를 넣어보세요.</p>
            <button class="btn btn-primary" type="button" id="emptyAddBtn">첫 일정 추가</button>
          </div>
        `;
        document.getElementById("emptyAddBtn")?.addEventListener("click", () => openItemEditor());
        return;
      }

      const sorted = [...day.items].sort((a, b) => (a.start || "99:99").localeCompare(b.start || "99:99"));
      els.timeline.innerHTML = sorted
        .map((item, index) => {
          const next = sorted[index + 1];
          const isOpen = openItemId === item.id;
          const map = mapsUrl(item);
          const dir = next ? directionsUrl(item, next) : null;
          const travelText = item.travelTime || (next ? "이동시간 미입력" : "");
          return `
            <div class="item-wrap">
              <div class="dot ${item.type || "place"}"></div>
              <article class="card ${isOpen ? "open" : ""}" data-id="${item.id}">
                <div class="card-top">
                  <div>
                    <div class="type-row">
                      <span class="badge ${item.type || "place"}">${TYPE_LABEL[item.type] || "장소"}</span>
                      <span class="time">${[item.start, item.end].filter(Boolean).join(" – ") || "시간 미정"}</span>
                    </div>
                    <div class="title">${escapeHtml(item.title)}</div>
                    ${item.place ? `<div class="subtitle">${escapeHtml(item.place)}</div>` : ""}
                  </div>
                  <div class="chev" aria-hidden="true">▾</div>
                </div>
                <div class="details">
                  ${item.note ? `<p>${escapeHtml(item.note)}</p>` : `<p style="color:var(--muted)">메모 없음</p>`}
                  <div class="meta-grid">
                    ${item.travelTime ? `<div class="meta"><span>다음까지</span><strong>${escapeHtml(item.travelTime)}</strong></div>` : ""}
                    ${item.place ? `<div class="meta"><span>장소</span><strong>${escapeHtml(item.place)}</strong></div>` : ""}
                  </div>
                  <div class="actions">
                    ${map ? `<a class="btn btn-primary" href="${map}" target="_blank" rel="noopener">구글맵 열기</a>` : ""}
                    ${dir ? `<a class="btn btn-ghost" href="${dir}" target="_blank" rel="noopener">다음 장소 동선</a>` : ""}
                    <button class="btn btn-ghost" type="button" data-edit="${item.id}">수정</button>
                    <button class="btn btn-danger" type="button" data-delete="${item.id}">삭제</button>
                  </div>
                </div>
              </article>
              ${
                next
                  ? `<div class="travel">
                      <span>↳ ${escapeHtml(travelText)}</span>
                      <span class="travel-line"></span>
                      ${dir ? `<a href="${dir}" target="_blank" rel="noopener">길찾기</a>` : ""}
                    </div>`
                  : ""
              }
            </div>
          `;
        })
        .join("");
    }

    function openItemEditor(item) {
      editingItemId = item?.id || null;
      document.getElementById("itemSheetTitle").textContent = item ? "일정 수정" : "일정 추가";
      document.getElementById("itemType").value = item?.type || "place";
      document.getElementById("itemTitle").value = item?.title || "";
      document.getElementById("itemPlace").value = item?.place || "";
      document.getElementById("itemStart").value = item?.start || "";
      document.getElementById("itemEnd").value = item?.end || "";
      document.getElementById("itemTravel").value = item?.travelTime || "";
      document.getElementById("itemMaps").value = item?.mapsQuery || "";
      document.getElementById("itemNote").value = item?.note || "";
      openSheet(els.itemSheet);
      setTimeout(() => document.getElementById("itemTitle").focus(), 220);
    }

    function openTripEditor() {
      const trip = activeTrip();
      document.getElementById("tripTitle").value = trip.title || "";
      document.getElementById("tripDesc").value = trip.subtitle || "";
      document.getElementById("tripStart").value = trip.startDate || "";
      document.getElementById("tripEnd").value = trip.endDate || "";
      openSheet(els.tripSheet);
    }

    function openTripsSheet() {
      renderTripsList();
      openSheet(els.tripsSheet);
    }

    function addDay() {
      const trip = activeTrip();
      const n = trip.days.length + 1;
      let date = "";
      if (trip.startDate) {
        const base = new Date(trip.startDate + "T00:00:00");
        base.setDate(base.getDate() + (n - 1));
        date = base.toISOString().slice(0, 10);
      }
      const day = { id: uid(), label: `Day ${n}`, date, items: [] };
      trip.days.push(day);
      trip.activeDayId = day.id;
      save();
      render();
      toast("날짜가 추가됐어요");
    }

    function deleteActiveDay() {
      const trip = activeTrip();
      if (trip.days.length <= 1) {
        toast("최소 1개의 날짜가 필요해요");
        return;
      }
      if (!confirm("현재 날짜와 일정을 삭제할까요?")) return;
      trip.days = trip.days.filter((d) => d.id !== trip.activeDayId);
      trip.activeDayId = trip.days[0].id;
      save();
      render();
      toast("날짜를 삭제했어요");
    }

    function addTrip() {
      const name = prompt("나라 / 여행 이름을 입력하세요", "일본");
      if (name === null) return;
      const trip = blankTrip(name.trim() || "새 여행");
      store.trips.push(trip);
      store.activeTripId = trip.id;
      openItemId = null;
      save();
      closeSheets();
      render();
      toast("새 여행이 추가됐어요");
    }

    function deleteTrip(id) {
      if (store.trips.length <= 1) {
        toast("최소 1개의 여행이 필요해요");
        return;
      }
      const trip = store.trips.find((t) => t.id === id);
      if (!confirm(`"${trip?.title || "여행"}"을 삭제할까요?`)) return;
      store.trips = store.trips.filter((t) => t.id !== id);
      if (store.activeTripId === id) store.activeTripId = store.trips[0].id;
      openItemId = null;
      save();
      renderTripsList();
      render();
      toast("여행을 삭제했어요");
    }

    function exportData() {
      const trip = activeTrip();
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `trip-${(trip.title || "backup").replace(/\s+/g, "-")}-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("JSON으로 내보냈어요");
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          store = migrate(data);
          store.updatedAt = Date.now();
          save();
          openItemId = null;
          render();
          toast("일정을 불러왔어요");
        } catch {
          toast("불러오기 실패 · JSON을 확인해 주세요");
        }
      };
      reader.readAsText(file);
    }

    els.dayTabs.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-day]");
      if (!btn) return;
      activeTrip().activeDayId = btn.dataset.day;
      openItemId = null;
      save();
      render();
    });

    els.timeline.addEventListener("click", (e) => {
      const editId = e.target.closest("[data-edit]")?.dataset.edit;
      const deleteId = e.target.closest("[data-delete]")?.dataset.delete;
      if (editId) {
        e.stopPropagation();
        openItemEditor(activeDay().items.find((i) => i.id === editId));
        return;
      }
      if (deleteId) {
        e.stopPropagation();
        if (!confirm("이 일정을 삭제할까요?")) return;
        const day = activeDay();
        day.items = day.items.filter((i) => i.id !== deleteId);
        if (openItemId === deleteId) openItemId = null;
        save();
        render();
        toast("삭제됐어요");
        return;
      }
      if (e.target.closest("a")) return;
      const card = e.target.closest(".card");
      if (!card) return;
      openItemId = openItemId === card.dataset.id ? null : card.dataset.id;
      render();
    });

    els.tripsList.addEventListener("click", (e) => {
      const switchId = e.target.closest("[data-switch]")?.dataset.switch;
      const deleteId = e.target.closest("[data-delete-trip]")?.dataset.deleteTrip;
      if (deleteId) {
        deleteTrip(deleteId);
        return;
      }
      if (switchId) {
        store.activeTripId = switchId;
        openItemId = null;
        save();
        closeSheets();
        render();
        toast("여행을 바꿨어요");
      }
    });

    document.getElementById("addItemFab").addEventListener("click", () => openItemEditor());
    document.getElementById("menuFab").addEventListener("click", () => openSheet(els.menuSheet));
    document.getElementById("tripsBtn").addEventListener("click", openTripsSheet);
    document.getElementById("editTripBtn").addEventListener("click", openTripEditor);
    document.getElementById("addDayBtn").addEventListener("click", addDay);
    document.getElementById("exportBtn").addEventListener("click", exportData);
    document.getElementById("importBtn").addEventListener("click", () => els.importFile.click());
    document.getElementById("addTripBtn").addEventListener("click", addTrip);
    els.importFile.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (file) importData(file);
      e.target.value = "";
    });

    document.getElementById("menuAddDay").addEventListener("click", () => { closeSheets(); addDay(); });
    document.getElementById("menuDeleteDay").addEventListener("click", () => { closeSheets(); deleteActiveDay(); });
    document.getElementById("menuClearTrip").addEventListener("click", () => {
      if (!confirm("현재 여행의 일정을 모두 지울까요?")) return;
      const trip = activeTrip();
      const dayId = uid();
      trip.days = [{ id: dayId, label: "Day 1", date: trip.startDate || "", items: [] }];
      trip.activeDayId = dayId;
      openItemId = null;
      save();
      closeSheets();
      render();
      toast("일정을 비웠어요");
    });

    document.getElementById("cancelItemBtn").addEventListener("click", closeSheets);
    document.getElementById("cancelTripBtn").addEventListener("click", closeSheets);
    els.backdrop.addEventListener("click", closeSheets);

    els.itemForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const day = activeDay();
      if (!day) return;
      const payload = {
        id: editingItemId || uid(),
        type: document.getElementById("itemType").value,
        title: document.getElementById("itemTitle").value.trim(),
        place: document.getElementById("itemPlace").value.trim(),
        start: document.getElementById("itemStart").value,
        end: document.getElementById("itemEnd").value,
        travelTime: document.getElementById("itemTravel").value.trim(),
        mapsQuery: document.getElementById("itemMaps").value.trim(),
        note: document.getElementById("itemNote").value.trim(),
      };
      if (!payload.title) return;
      const idx = day.items.findIndex((i) => i.id === payload.id);
      if (idx >= 0) day.items[idx] = payload;
      else day.items.push(payload);
      openItemId = payload.id;
      save();
      closeSheets();
      render();
      toast(idx >= 0 ? "수정됐어요" : "일정이 추가됐어요");
    });

    els.tripForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const trip = activeTrip();
      trip.title = document.getElementById("tripTitle").value.trim() || "새 여행";
      trip.subtitle = document.getElementById("tripDesc").value.trim();
      trip.startDate = document.getElementById("tripStart").value;
      trip.endDate = document.getElementById("tripEnd").value;
      if (trip.startDate) {
        trip.days.forEach((day, i) => {
          if (!day.date) {
            const d = new Date(trip.startDate + "T00:00:00");
            d.setDate(d.getDate() + i);
            day.date = d.toISOString().slice(0, 10);
          }
        });
      }
      save();
      closeSheets();
      render();
      toast("여행 정보를 저장했어요");
    });

    render();
    pullRemote({ silent: true });
    setInterval(() => pullRemote({ silent: true }), 2500);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") pullRemote({ silent: true });
    });
    window.addEventListener("online", () => pullRemote({ silent: true }));

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const tipEl = document.getElementById("installTip");
    if (tipEl && isIos && !isStandalone && localStorage.getItem("trip-hide-tip") !== "1") {
      tipEl.classList.add("show");
    }
    document.getElementById("dismissTipBtn")?.addEventListener("click", () => {
      localStorage.setItem("trip-hide-tip", "1");
      tipEl?.classList.remove("show");
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
